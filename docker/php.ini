; Pengaturan PHP tambahan untuk container (di atas php.ini-production)
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

; batas upload (validasi aplikasi tetap max 500KB per gambar)
upload_max_filesize = 4M
post_max_size = 4M

session.use_strict_mode = 1
session.gc_maxlifetime = 7200

opcache.enable = 1
opcache.validate_timestamps = 0
